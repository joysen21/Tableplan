# Automatische Prüfung bei jedem Push und Pull Request:
#   1) Typecheck + Unit-Tests (schnell)
#   2) Oberflächentests im Demo-Modus (Playwright, Desktop + Handy)
# Damit nichts Ungeprüftes live geht: in GitHub unter Settings → Branches für „main“
# „Require status checks to pass“ mit den Checks „Typecheck & Unit-Tests“ und „Oberflächentests“ aktivieren.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Ältere Läufe desselben Branches abbrechen, wenn neu gepusht wird
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Oberflächentests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Oberflächentests (baut die App und startet die Vorschau selbst)
        run: npm run e2e
      - name: Bericht und Screenshots bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
